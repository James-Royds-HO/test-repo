name: Checkov Scan
 
on:
  push:
    branches:
      - main
      - feature/README-changes
  pull_request:
    branches:
      - main
      - feature/README-changes

permissions:
  contents: read
  id-token: write
  actions: read
  security-events: write

jobs:
  checkov-scan:
    uses: UKHomeOffice/core-cloud-workflow-checkov-sast-scan/.github/workflows/checkov-scan-base.yaml@main
