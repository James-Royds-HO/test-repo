name: Build and scan Docker image using the Trivy image stored in our ECR

on:
  workflow_call:
    inputs:
      aws_region:
        description: "AWS region for ECR (default: eu-west-2)"
        required: false
        type: string
        default: "eu-west-2"
      working_directory:
        description: "Directory to run npm audit in (default: repository root)"
        required: false
        type: string
        default: "."
      dockerfile:
        description: "Directory/Name of the Dockerfile (default: Dockerfile)"
        required: false
        type: string
        default: "Dockerfile"
      image_name:
        description: "Name of the image"
        required: true
        type: string
      image_tag:
        description: "The tag for the image (default: latest)"
        required: false
        type: string
        default: latest
      tag_latest:
        description: "Should it also use the tag latest (default: true)"
        required: false
        type: boolean
        default: true
      trivy_tag:
        description: "Tag of the Trivy image in ECR (default: 0.69.3)"
        required: false
        type: string
        default: "0.69.3"
    secrets:
      AWS_ECR_ACCOUNT_ID:
        description: "AWS Account ID for ECR"
        required: true
      ROLE_TO_ASSUME:
        description: "The role to assume for AWS ECR access"
        required: true

jobs:
  build-scan-using-ecr-trivy-image:
    name: "Run docker build and then trivy scan using trivy image in ECR"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Docker
        uses: Home-Office-Digital/core-cloud-workflow-docker-actions/actions/setup@1.2.0

      - name: Build Docker Image
        uses: Home-Office-Digital/core-cloud-workflow-docker-actions/actions/build@1.2.0
        with:
          working_directory: "."
          dockerfile: "Dockerfile"
          image_name: "hello-world"
          image_tag: "0.0.1"

      - name: Assume Role in Account
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ROLE_TO_ASSUME }}
          aws-region: ${{ inputs.aws_region }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Scan Docker Image with Trivy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            ${{ secrets.AWS_ECR_ACCOUNT_ID }}.dkr.ecr.${{ inputs.aws_region }}.amazonaws.com/platform/trivy:${{ inputs.trivy_tag }} \
            image \
            --exit-code 1 \
            --severity HIGH,CRITICAL \
            ${{ inputs.image_name }}:${{ inputs.image_tag }}
